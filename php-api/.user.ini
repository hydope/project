; ShiaRishta PHP API — per-directory PHP settings (PHP-FPM / CGI SAPIs).
; Deploy target: public_html/api/ alongside index.php.
;
; Why this exists (2026-11-21): the host's default upload_max_filesize
; (2M) silently rejected Social Scheduler video uploads — an 80 KB test
; clip uploaded fine while a 5.5 MB Reel died with PHP's UPLOAD_ERR_INI_SIZE
; before the app ever saw the file. Scheduler videos may be up to 200 MB
; at the app layer (socialStoreUpload), so the PHP ceiling must sit above
; real-world Reels with room to spare.
; upload_max_filesize / post_max_size are PHP_INI_PERDIR: they can ONLY be
; set here (or in .htaccess under mod_php), never via ini_set() at runtime.
upload_max_filesize = 64M
post_max_size = 66M
max_execution_time = 300
max_input_time = 300
