# CI: build + unit tests on every push/PR to main.
# E2E regression suites (scripts/test-*.cjs) need seeded fixtures and a dev
# server; run them locally or in a dedicated job once fixtures are CI-safe.
name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint all PHP files
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null 2>&1 || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(find php-api -name '*.php')
          if [ "$fail" = "1" ]; then echo "Failing CI: PHP syntax errors present."; exit 1; fi
          echo "PHP lint clean"
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-bundle-budget.mjs
      - run: node scripts/test-unit.cjs
