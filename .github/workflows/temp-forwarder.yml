name: Temp - Create Email Forwarder
# TEMPORARY workflow: creates seo@shiarishta.com forwarder via cPanel UAPI.
# Delete after use. Trigger via workflow_dispatch with the destination address.
on:
  workflow_dispatch:
    inputs:
      dest:
        description: 'Destination email address for the forwarder'
        required: true
jobs:
  create-forwarder:
    runs-on: ubuntu-latest
    steps:
      - name: Create forwarder via cPanel UAPI
        env:
          CPANEL_USER: ${{ secrets.FTP_USERNAME }}
          CPANEL_PASS: ${{ secrets.FTP_PASSWORD }}
          DEST: ${{ inputs.dest }}
        run: |
          python3 - <<'EOF'
          import requests, re, sys, os, urllib3
          urllib3.disable_warnings()
          CPANEL = 'https://ind85.server.broker:2083'
          USER = os.environ['CPANEL_USER']
          PASS = os.environ['CPANEL_PASS']
          DEST = os.environ['DEST']
          s = requests.Session()
          r = s.post(f'{CPANEL}/login/', data={'user': USER, 'pass': PASS},
                     allow_redirects=False, verify=False, timeout=30)
          m = re.search(r'/cpsess(\d+)/', r.headers.get('Location', ''))
          if not m:
              print('CPANEL LOGIN FAILED'); sys.exit(1)
          base = f"{CPANEL}/cpsess{m.group(1)}/execute"
          print('cPanel session established')
          def uapi(mod, func, **params):
              r = s.get(f'{base}/{mod}/{func}', params=params, verify=False, timeout=30)
              return r.json()
          # Remove any existing forwarder first (idempotent)
          j = uapi('Email', 'delete_forwarder', address='seo@shiarishta.com')
          print('delete existing:', j.get('status'))
          j = uapi('Email', 'add_forwarder', domain='shiarishta.com', email='seo',
                   fwdopt='fwd', fwdemail=DEST)
          print('add_forwarder:', j.get('status'), (j.get('errors') or [None])[0])
          assert j.get('status') == 1, f"forwarder creation failed: {j}"
          j = uapi('Email', 'list_forwarders')
          fwds = [f.get('dest') for f in (j.get('data') or []) if f.get('dest') == 'seo@shiarishta.com']
          print('seo forwarder present:', bool(fwds))
          assert fwds, 'forwarder not found after creation'
          print('FORWARDER_OK')
          EOF
