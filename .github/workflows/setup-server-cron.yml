name: Setup Server Cron Jobs

# One-time setup: creates cPanel cron jobs so ShiaRishta runs autonomously
# without GitHub Actions or manual intervention.
#
# Jobs created:
# 1. Daily profile seeder - 6:00 AM UTC (runs php script on server)
# 2. Blog publish-due - every hour (publishes scheduled posts whose time arrived)
#
# Run once via workflow_dispatch, then disable/delete.

on:
  workflow_dispatch:

jobs:
  setup-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Create cPanel cron jobs via UAPI
        env:
          CPANEL_USER: ${{ secrets.FTP_USERNAME }}
          CPANEL_PASS: ${{ secrets.FTP_PASSWORD }}
          CPANEL_HOST: ind85.server.broker
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.parse, base64

          user = os.environ['CPANEL_USER']
          pw = os.environ['CPANEL_PASS']
          host = os.environ['CPANEL_HOST']

          auth = base64.b64encode(f"{user}:{pw}".encode()).decode()
          headers = {"Authorization": f"Basic {auth}"}

          def uapi(module, func, params={}):
              qs = urllib.parse.urlencode(params)
              url = f"https://{host}:2083/execute/{module}/{func}?{qs}"
              req = urllib.request.Request(url, headers=headers)
              # cPanel uses self-signed cert on some hosts
              import ssl
              ctx = ssl.create_default_context()
              ctx.check_hostname = False
              ctx.verify_mode = ssl.CERT_NONE
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
                      return json.load(r)
              except Exception as e:
                  print(f"UAPI {module}/{func} failed: {e}")
                  return None

          # 1. Daily profile seeder at 6:00 AM UTC (1 AM EST)
          # Runs the PHP seeder directly on the server
          print("Creating profile seeder cron...")
          r1 = uapi("Cron", "add_line", {
              "command": "/usr/local/bin/php /home/shiarishta/public_html/api/seed-daily-profiles.php >> /home/shiarishta/seeder.log 2>&1",
              "day": "*",
              "hour": "6",
              "minute": "0",
              "month": "*",
              "weekday": "*",
          })
          print(f"Seeder cron: {json.dumps(r1)[:200] if r1 else 'FAILED'}")

          # 2. Blog publish-due every hour — publishes posts whose scheduled time arrived
          # Reads BLOG_CRON_KEY from the server .env file
          print("Creating blog publish cron...")
          r2 = uapi("Cron", "add_line", {
              "command": 'KEY=$(grep BLOG_CRON_KEY /home/shiarishta/public_html/api/.env | cut -d= -f2); curl -s -X POST https://shiarishta.com/api/ai/publish-due -H "X-Blog-Cron-Key: $KEY" >> /home/shiarishta/blog-publish.log 2>&1',
              "day": "*",
              "hour": "*",
              "minute": "0",
              "month": "*",
              "weekday": "*",
          })
          print(f"Blog cron: {json.dumps(r2)[:200] if r2 else 'FAILED'}")

          print("Done. Verify in cPanel > Cron Jobs.")
          PYEOF
