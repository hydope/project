name: Social Publish Cron

# Publishes due social posts (manual, autopilot and ingested reels) to
# Facebook, Instagram and YouTube through their official APIs. Runs every
# 5 minutes — GitHub Actions' minimum schedule interval — so a scheduled
# post goes out within minutes of its slot.
#
# Fully autonomous: calls the server-side HTTP trigger which runs the
# publish cron PHP script on the production server (where MySQL and the
# stored platform tokens are reachable). The script is idempotent: each
# post target is claimed atomically before publishing, so overlapping
# runs can never double-post.
#
# Reliability notes (2026-11-22): GitHub fires this */5 schedule only
# sporadically in practice (2 firings in ~19h were observed while a
# 12-post backlog sat unpublished); the web server kills any request
# at ~120s (LiteSpeed Connection Timeout), which is what stranded a
# target mid-publish and wedged the queue; and the endpoint therefore
# budgets each invocation to ~60s of new work. So a single firing now
# LOOPS the trigger until the endpoint reports an empty queue — one
# firing drains the whole backlog instead of one slice.

on:
  schedule:
    # Three offset lines for the same 5-minute cadence: GitHub drops
    # most scheduled firings for this repo (2 in ~19h observed on the
    # single line), so each offset is another lottery ticket. Runs are
    # serialized by the concurrency group below, and the drain is
    # idempotent, so extra firings are harmless.
    - cron: '*/5 * * * *'
    - cron: '2/5 * * * *'
    - cron: '4/5 * * * *'
  workflow_dispatch: # Allow manual trigger

# Serialize runs of this workflow: a firing that arrives while another
# is draining queues behind it instead of racing the same targets.
concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server-side social publish cron until queue drains
        env:
          SEEDER_CRON_KEY: ${{ secrets.SEEDER_CRON_KEY }}
        run: |
          OK_CALLS=0
          DRAINED=0
          for i in $(seq 1 12); do
            echo "Triggering social publish cron on production server (call $i)..."
            # The server kills any request at ~120s (LiteSpeed
            # Connection Timeout), so cap curl just above that; the
            # endpoint budgets its own work to ~60s and answers well
            # before the cap in normal operation.
            RESP=$(curl -s --max-time 150 -X POST https://shiarishta.com/api/social-publish-cron.php \
              -H "X-Seeder-Cron-Key: $SEEDER_CRON_KEY" \
              -H "Content-Type: application/json" || true)

            echo "Response: $RESP"

            if echo "$RESP" | grep -q '"ok":true'; then
              OK_CALLS=$((OK_CALLS + 1))
              PROCESSED=$(echo "$RESP" | grep -o '"processed":[0-9]*' | head -1 | cut -d: -f2)
              if [ -z "$PROCESSED" ] || [ "$PROCESSED" = "0" ]; then
                echo "✓ Queue drained — no due posts left"
                DRAINED=1
                break
              fi
              echo "Processed $PROCESSED post(s); checking for more..."
            else
              # No JSON back (e.g. the server's 120s timeout page).
              # Per-target progress is persisted server-side as it
              # completes, so a cut-off call is not lost work — keep
              # looping; the next call resumes what is still due.
              echo "Call $i returned no ok JSON — continuing (progress is durable server-side)"
              sleep 5
            fi
          done
          if [ "$OK_CALLS" = "0" ]; then
            echo "✗ Social publish cron failed — no successful endpoint call"
            exit 1
          fi
          if [ "$DRAINED" = "1" ]; then
            echo "✓ Social publish cron completed — queue drained"
          else
            echo "✓ Social publish cron completed — progress made, queue not fully drained (next firing continues)"
          fi
