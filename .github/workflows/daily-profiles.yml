name: Daily Profile Seeder

# Creates 5 new member profiles every day (4 female, 1 male)
# with realistic Shia names and cities.
# Runs at 6:00 AM UTC daily (1:00 AM EST / 2:00 AM EDT).
#
# Fully autonomous: calls the server-side HTTP trigger which runs
# the seeder PHP script on the production server (where MySQL is reachable).
# No manual intervention needed.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server-side profile seeder
        env:
          SEEDER_CRON_KEY: ${{ secrets.SEEDER_CRON_KEY }}
        run: |
          echo "Triggering profile seeder on production server..."
          RESP=$(curl -s --max-time 120 -X POST https://shiarishta.com/api/seed-daily-cron.php \
            -H "X-Seeder-Cron-Key: $SEEDER_CRON_KEY" \
            -H "Content-Type: application/json")

          echo "Response: $RESP"

          # Check if successful
          echo "$RESP" | grep -q '"ok":true' && {
            echo "✓ Seeder completed successfully"
            exit 0
          }

          echo "✗ Seeder failed"
          exit 1
