name: Daily Profile Seeder

# Creates 12 new member profiles every day (8 female, 4 male)
# with realistic Shia names and cities.
# Runs at 6:00 AM UTC daily (1:00 AM EST / 2:00 AM EDT).

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql

      - name: Run daily profile seeder
        env:
          DB_HOST: ${{ secrets.MYSQL_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cd php-api
          php seed-daily-profiles.php
