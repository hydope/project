name: Social Autopilot Cron

# Hourly fallback generator for the social scheduler's autopilot mode:
# when autopilot is ON and no reel is waiting for the next hour's slot,
# the server fills the slot with a generated text/image post in
# ShiaRishta's style. When autopilot is OFF (the default until live
# proof passes) the endpoint returns immediately without generating.
#
# Fully autonomous: calls the server-side HTTP trigger which runs the
# autopilot cron PHP script on the production server (where MySQL is
# reachable). Runs at 7 minutes past the hour so finished reels ingested
# on the hour get first claim on the slot.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server-side social autopilot cron
        env:
          SEEDER_CRON_KEY: ${{ secrets.SEEDER_CRON_KEY }}
        run: |
          echo "Triggering social autopilot cron on production server..."
          RESP=$(curl -s --max-time 120 -X POST https://shiarishta.com/api/social-autopilot-cron.php \
            -H "X-Seeder-Cron-Key: $SEEDER_CRON_KEY" \
            -H "Content-Type: application/json")

          echo "Response: $RESP"

          echo "$RESP" | grep -q '"ok":true' && {
            echo "✓ Social autopilot cron completed successfully"
            exit 0
          }

          echo "✗ Social autopilot cron failed"
          exit 1
