name: Temp user diagnostic (delete after use)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload, query, delete diagnostic
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          TOKEN=$(openssl rand -hex 16)
          FNAME="diag-tmp-${TOKEN}.php"
          sed "s/__DIAG_TOKEN__/${TOKEN}/" diag-tmp.php > /tmp/diag.php
          curl -s --insecure --ftp-ssl -T /tmp/diag.php "ftp://${FTP_USER}:${FTP_PASS}@${FTP_SERVER}/public_html/api/${FNAME}"
          echo "=== RESULT ==="
          curl -s --max-time 30 "https://shiarishta.com/api/${FNAME}?token=${TOKEN}"
          echo ""
          echo "=== DELETING ==="
          curl -s --insecure --ftp-ssl "ftp://${FTP_USER}:${FTP_PASS}@${FTP_SERVER}/" -Q "DELE public_html/api/${FNAME}" -o /dev/null
          echo "deleted"
