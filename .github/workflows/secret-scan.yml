name: Secret scan
on: [push, pull_request]
jobs:
  scan:
    name: Scan working tree and full history for credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history is what matters: a key committed once and "fixed" in a
          # later commit is still in the repository and in every clone.
          fetch-depth: 0

      - name: Scan working tree for real credentials
        run: |
          set -uo pipefail
          failed=0

          # Real-shaped NVIDIA key. The repo legitimately contains the literal
          # string "nvapi-" inside a regex and in comments, so the shape check
          # requires the long body a real key always has.
          if git grep -nIE 'nvapi-[A-Za-z0-9_-]{40,}' -- . ; then
            echo "::error::A real-shaped NVIDIA key is committed in the working tree."
            failed=1
          fi

          # Generic high-entropy credential assignments.
          if git grep -nIE '(API_KEY|SECRET|TOKEN|PASSWORD)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9/+_-]{32,}' -- . ; then
            echo "::error::A credential-shaped assignment is committed in the working tree."
            failed=1
          fi

          # Private keys of any kind.
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' -- . ; then
            echo "::error::A private key is committed in the working tree."
            failed=1
          fi

          # .env must never be tracked.
          if git ls-files --error-unmatch .env php-api/.env >/dev/null 2>&1 ; then
            echo "::error::An .env file is tracked by git."
            failed=1
          fi

          exit $failed

      - name: Scan every commit in history for a real NVIDIA key
        run: |
          set -uo pipefail
          # Iterate blobs, not diffs: a secret present since the first commit
          # never appears in a later diff, so `git log -S` alone misses it.
          hits=$(git rev-list --all | while read -r c; do
            git grep -I -E 'nvapi-[A-Za-z0-9_-]{40,}' "$c" 2>/dev/null || true
          done)
          if [ -n "$hits" ]; then
            echo "::error::A real-shaped NVIDIA key exists in git history."
            echo "$hits" | head -5
            exit 1
          fi
          echo "OK: no real-shaped NVIDIA key in any commit."

      - name: Fail if the key exposed during the audit is present anywhere
        run: |
          set -uo pipefail
          # The specific credential pasted into a chat session during the audit.
          #
          # Compared by SHA-256 digest and never by value: writing the literal key
          # into this file would be the exact leak the job exists to prevent. An
          # earlier draft of this step did that, and had to be amended and
          # force-pushed to remove it.
          needle_sha="962e9ad852f027e4bf559b1f7a6f5c390673bf4737ad54f0c16a2273d8d2b2c7"

          found=0
          while read -r tok; do
            if [ -z "$tok" ]; then continue; fi
            if [ "$(printf '%s' "$tok" | sha256sum | cut -d' ' -f1)" = "$needle_sha" ]; then
              found=1
            fi
          done < <(git rev-list --all | while read -r c; do
                       git grep -I -o -E 'nvapi-[A-Za-z0-9_-]{20,}' "$c" 2>/dev/null || true
                     done | sort -u)

          if [ "$found" -eq 1 ]; then
            echo "::error::The NVIDIA key exposed during the audit is present in git history."
            exit 1
          fi
          echo "OK: the audit-exposed key is not in the repository or its history."

      - name: Reminder about rotation
        if: always()
        run: |
          echo "::notice::This job only proves a secret is absent from the repository."
          echo "::notice::It does NOT mean a key pasted into chat, a log or a screenshot"
          echo "::notice::is safe. Anything ever pasted into a conversation must be revoked"
          echo "::notice::at the provider and replaced. Deleting it from git revokes nothing."
