name: Daily Blog Queue
# Generates one SEO-targeted blog post per day.
#
# Two-phase flow: the shared host cannot reliably reach the NVIDIA API, so
# generation happens HERE on the runner (which can). The API only hands out
# topics and saves finished posts.
#
#   1. GET /api/ai/queue-next  -> next queued topic (service-key authed)
#   2. Call NVIDIA chat/completions with the topic
#   3. POST /api/ai/queue-save -> save as scheduled (service-key authed)
on:
  schedule:
    - cron: '15 9 * * *' # 09:15 UTC daily
  workflow_dispatch:
jobs:
  queue-run:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and save one queued blog post
        env:
          BLOG_CRON_KEY: ${{ secrets.BLOG_CRON_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          API="https://shiarishta.com/api/ai"

          # 1. Next topic
          TOPIC_JSON=$(curl -s --max-time 30 "$API/queue-next" -H "X-Blog-Cron-Key: $BLOG_CRON_KEY")
          echo "$TOPIC_JSON" | grep -q '"ok":true' || { echo "NO_TOPIC: $TOPIC_JSON"; echo "QUEUE_DONE_OR_EMPTY"; exit 0; }
          TOPIC_ID=$(echo "$TOPIC_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['topic']['id'])")
          echo "Topic: $TOPIC_ID"

          # 2. Generate via NVIDIA (runner has reliable egress; the shared host does not)
          echo "$TOPIC_JSON" > /tmp/topic.json
          python3 .github/scripts/build_prompt.py /tmp/topic.json > /tmp/gen.json
          python3 -c "import json,sys; print(json.load(open('/tmp/gen.json'))['system'])" > /tmp/system_prompt.txt
          python3 .github/scripts/build_payload.py /tmp/system_prompt.txt /tmp/nvidia_payload.json

          NVIDIA_RESP=$(curl -s --max-time 180 --retry 2 -X POST https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/nvidia_payload.json)

          POST_JSON=$(echo "$NVIDIA_RESP" | python3 .github/scripts/parse_post.py)
