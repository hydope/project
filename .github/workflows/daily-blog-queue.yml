name: Daily Blog Queue
# Maintains 30 scheduled blog posts and auto-publishes due ones.
#
# Two-phase flow: the shared host cannot reliably reach the NVIDIA API, so
# generation happens HERE on the runner (which can). The API only hands out
# topics and saves finished posts.
#
# Each run:
#   1. POST /api/ai/publish-due   -> flip due scheduled posts to published
#   2. GET  /api/ai/scheduled-count -> how many are pending (target: 30)
#   3. Loop: GET /api/ai/queue-next -> NVIDIA generate -> POST /api/ai/queue-save
#      until 30 scheduled or queue empty (max 5 per run to bound runtime)
on:
  schedule:
    - cron: '15 9 * * *' # 09:15 UTC daily
  workflow_dispatch:
jobs:
  queue-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts and top up scheduled queue to 30
        env:
          BLOG_CRON_KEY: ${{ secrets.BLOG_CRON_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          API="https://shiarishta.com/api/ai"
          AUTH_HDR="X-Blog-Cron-Key: $BLOG_CRON_KEY"

          # 1. Publish anything whose scheduled time has arrived
          echo "--- publishing due posts ---"
          curl -s --max-time 30 -X POST "$API/publish-due" -H "$AUTH_HDR"
          echo

          # 2. How many are scheduled? Top up to 30.
          echo "--- checking scheduled count ---"
          COUNT_JSON=$(curl -s --max-time 30 "$API/scheduled-count" -H "$AUTH_HDR")
          echo "$COUNT_JSON"
          DEFICIT=$(echo "$COUNT_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('deficit', 0))")
          echo "Deficit: $DEFICIT"

          # Bound per-run work: at most 5 generations (each ~2-3 min via NVIDIA).
          # The daily cadence closes the gap over several days; a big initial
          # deficit is backfilled gradually without timing out the job.
          MAX_GEN=5
          if [ "$DEFICIT" -gt "$MAX_GEN" ]; then
            echo "Capping generation at $MAX_GEN for this run (deficit $DEFICIT)"
            DEFICIT=$MAX_GEN
          fi

          # 3. Generate and save posts until the deficit is filled
          GENERATED=0
          while [ "$GENERATED" -lt "$DEFICIT" ]; do
            echo "--- generating post $((GENERATED + 1)) of $DEFICIT ---"

            # 3a. Next topic
            TOPIC_JSON=$(curl -s --max-time 30 "$API/queue-next" -H "$AUTH_HDR")
            echo "$TOPIC_JSON" | grep -q '"ok":true' || { echo "NO_TOPIC: $TOPIC_JSON"; echo "QUEUE_DONE_OR_EMPTY"; break; }
            TOPIC_ID=$(echo "$TOPIC_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['topic']['id'])")
            echo "Topic: $TOPIC_ID"

            # 3b. Generate via NVIDIA (runner has reliable egress; the shared host does not)
            echo "$TOPIC_JSON" > /tmp/topic.json
            python3 .github/scripts/build_prompt.py /tmp/topic.json > /tmp/gen.json
            python3 -c "import json,sys; print(json.load(open('/tmp/gen.json'))['system'])" > /tmp/system_prompt.txt
            python3 .github/scripts/build_payload.py /tmp/system_prompt.txt /tmp/nvidia_payload.json

            NVIDIA_RESP=$(curl -s --max-time 180 --retry 2 -X POST https://integrate.api.nvidia.com/v1/chat/completions \
              -H "Authorization: Bearer $NVIDIA_API_KEY" \
              -H "Content-Type: application/json" \
              -d @/tmp/nvidia_payload.json)

            POST_JSON=$(echo "$NVIDIA_RESP" | python3 .github/scripts/parse_post.py)
            if ! echo "$POST_JSON" | grep -q '"title"'; then
              echo "PARSE_FAILED: $POST_JSON"
              echo "Full NVIDIA response (first 2000 chars):"
              echo "$NVIDIA_RESP" | head -c 2000
              echo ""
              # Fallback: deterministic template post so a bad model day
              # can never empty the queue.
              echo "Using fallback template post..."
              POST_JSON=$(python3 .github/scripts/fallback_post.py /tmp/topic.json)
            fi

            # Pick a random cover image from the pool
            COVERS=("blog-cover-1.webp" "blog-cover-2.webp" "blog-cover-3.webp" "blog-cover-4.webp")
            COVER=${COVERS[$RANDOM % ${#COVERS[@]}]}
            IMAGE_URL="/api/uploads/blog-covers/$COVER"
            # Inject image_url into the post JSON (script file keeps the
            # workflow YAML free of embedded-python indentation traps)
            POST_JSON=$(echo "$POST_JSON" | python3 .github/scripts/inject_image.py "$IMAGE_URL")
            if ! echo "$POST_JSON" | grep -q '"title"'; then
              echo "FALLBACK_FAILED: no usable post for topic $TOPIC_ID, moving on"
              continue
            fi

            # 3c. Save as scheduled. queue-save expects { topic_id, post: {bare post} }
            # — POST_JSON is already the bare post here; do NOT re-wrap it.
            SAVE_JSON=$(curl -s --max-time 30 -X POST "$API/queue-save" -H "$AUTH_HDR" \
              -H "Content-Type: application/json" \
              -d "{\"topic_id\": \"$TOPIC_ID\", \"post\": $POST_JSON}")
            echo "Save result: $SAVE_JSON"
            if ! echo "$SAVE_JSON" | grep -q '"ok":true'; then
              echo "SAVE_FAILED for topic $TOPIC_ID, moving on to next topic"
              continue
            fi

            GENERATED=$((GENERATED + 1))
          done

          echo "--- done: generated $GENERATED posts this run ---"
