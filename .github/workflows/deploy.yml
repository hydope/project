name: Deploy to cPanel

# Deploys the Shia Rishta app to shared cPanel hosting on every push to main.
#   Frontend (Vite dist/)      -> /public_html/            (https://shiarishta.com)
#   PHP API (php-api/)         -> /public_html/api/        (https://shiarishta.com/api)
#   Production .env is generated from GitHub Secrets at deploy time and is
#   never committed to the repository.
#
# Required repository secrets:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD,
#   MYSQL_HOST, CPANEL_MYSQL_USER, CPANEL_MYSQL_PASSWORD,
#   DB_NAME, DB_USER, DB_PASSWORD, JWT_SECRET, DATA_ENCRYPTION_KEY,
#   ADMIN_EMAILS (comma-separated emails that become admins on register)
#
# Transport note (2026-10-05): uploads go over FTPS via lftp, with retry loops
# around each mirror. An rsync-over-SSH attempt was reverted the same day: the
# host accepts the TCP connection on port 22 and even answers ssh-keyscan, but
# resets the connection during the SSH handshake ("kex_exchange_identification:
# read: Connection reset by peer"), so SSH can never authenticate from GitHub
# runner IPs. FTPS is the proven transport here (weeks of green deploys); its
# one observed failure mode — a passive-data-connection timeout — is transient
# and handled by the retries below. The SSH_PRIVATE_KEY secret is intentionally
# left unset.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax gate (blocks deploy on parse errors)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint all deployed PHP files
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null 2>&1 || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(find php-api -name '*.php' -not -path '*/tests/*')
          if [ "$fail" = "1" ]; then echo "Failing deploy: PHP syntax errors present."; exit 1; fi
          echo "PHP lint clean"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          VITE_API_URL=https://shiarishta.com \
          VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
          VITE_FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }} \
          npm run build

          # The prerender rewrites every route's <head> and <body>. A silently failing
          # regex would ship 15 identical documents that all claim to be the homepage -
          # every route still returns 200, so nothing else would notice. Verify the real
          # build output before anything is published.
          echo "--- verifying prerender ---"
          npm run verify:prerender

          # PHP assertions: RBAC, routing, privacy tiers, the shell filter and its
          # inverted-array_filter regression guard.
          echo "--- php assertions ---"
          php php-api/tests/admin-routing-test.php
          php php-api/tests/seo-shell-test.php
          php php-api/tests/test-shell-probe.php
          php php-api/tests/ai-parser-probe.php
          echo "--- dist contents ---"
          ls dist/
          test -f dist/.htaccess && echo "OK: .htaccess present in dist" || (echo "FAIL: .htaccess missing from dist"; exit 1)
          test -f dist/index.html && echo "OK: index.html present" || (echo "FAIL: index.html missing"; exit 1)

          # Per-route prerender must actually be in the artifact. If the build step is
          # ever reordered or skipped, these directories disappear and every route falls
          # back to the SPA shell with the homepage's H1 - the exact defect fixed here.
          for route in privacy terms about safety contact profiles; do
            if [ -f "dist/${route}/index.html" ]; then
              if grep -q "rel=\"canonical\" href=\"https://shiarishta.com/${route}\"" "dist/${route}/index.html"; then
                echo "OK: /${route} prerendered"
              else
                echo "FAIL: /${route} has no route-specific canonical"
                exit 1
              fi
          else
            echo "FAIL: /${route} was not prerendered"
            exit 1
          fi
          done

      - name: Database setup via cPanel UAPI
        env:
          CPANEL_USER: ${{ secrets.FTP_USERNAME }}
          CPANEL_PASS: ${{ secrets.FTP_PASSWORD }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import requests, re, sys, os, urllib3
          urllib3.disable_warnings()
          CPANEL = 'https://ind85.server.broker:2083'
          USER = os.environ['CPANEL_USER']
          PASS = os.environ['CPANEL_PASS']
          DB_PASS = os.environ['DB_PASS']
          s = requests.Session()
          r = s.post(f'{CPANEL}/login/', data={'user': USER, 'pass': PASS},
                     allow_redirects=False, verify=False, timeout=30)
          m = re.search(r'/cpsess(\d+)/', r.headers.get('Location', ''))
          if not m:
              print('CPANEL LOGIN FAILED'); sys.exit(1)
          base = f"{CPANEL}/cpsess{m.group(1)}/execute"
          print('cPanel session established')
          def uapi(mod, func, **params):
              r = s.get(f'{base}/{mod}/{func}', params=params, verify=False, timeout=30)
              return r.json()
          j = uapi('Mysql', 'create_database', name=f'{USER}_app')
          print('create_database:', j.get('status'), (j.get('errors') or [None])[0])
          j = uapi('Mysql', 'create_user', name=f'{USER}_appuser', password=DB_PASS)
          print('create_user:', j.get('status'), (j.get('errors') or [None])[0])
          j = uapi('Mysql', 'set_privileges_on_database', user=f'{USER}_appuser',
                   database=f'{USER}_app', privileges='ALL PRIVILEGES')
          print('grant:', j.get('status'), (j.get('errors') or [None])[0])
          j = uapi('Mysql', 'list_databases')
          dbs = [d.get('database') for d in (j.get('data') or [])]
          print('databases now:', dbs)
          assert f'{USER}_app' in dbs, 'database not found after creation'
          print('DATABASE_SETUP_OK')
          EOF

      - name: Generate production .env
        run: |
          # UPLOAD_DIR must point at the cPanel account home (e.g. /home/<user>/
          # uploads), which is writable and sits ABOVE public_html. It was
          # previously hardcoded to /home/shiarishta/uploads, which does not
          # exist for this account — photo upload then died with a 500 because
          # mkdir() silently failed.
          UPLOAD_BASE="/home/${{ secrets.FTP_USERNAME }}/uploads"
          cat > php-api/.env <<EOF
          APP_ENV=production
          DB_HOST=localhost
          DB_PORT=3306
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          DATA_ENCRYPTION_KEY=${{ secrets.DATA_ENCRYPTION_KEY }}
          BLOG_CRON_KEY=${{ secrets.BLOG_CRON_KEY }}
          CLIENT_URL=https://shiarishta.com
          UPLOAD_DIR=${UPLOAD_BASE}
          MAIL_TRANSPORT=${{ secrets.SMTP_HOST != '' && 'smtp' || '' }}
          MAIL_ENABLED=true
          MAIL_FROM=Shia Rishta <no-reply@shiarishta.com>
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
          PROMOTE_TOKEN=${{ secrets.PROMOTE_TOKEN }}
          # NVIDIA NIM — read server-side only, by php-api/lib/ai.php. Never sent
          # to the browser. Blank is survivable: the assistant falls back to the
          # retrieved platform facts and content drafting is disabled.
          NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL=https://integrate.api.nvidia.com/v1
          NVIDIA_MODEL=nvidia/nemotron-3.5-lightning-30b-a3b
          # Social login — Google + Facebook OAuth. Blank = buttons hidden.
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}
          TZ=America/New_York
          EOF
          echo ".env generated with $(wc -l < php-api/.env) lines (values from secrets, not shown)"
          echo "UPLOAD_DIR=${UPLOAD_BASE}"
          # Fail loudly if the AI key is absent, but do not block the deploy —
          # the rest of the site is unaffected by it. A silent blank here reads
          # as "the assistant is broken" rather than "no key was configured".
          if [ -n "${{ secrets.NVIDIA_API_KEY }}" ]; then
            echo "NVIDIA_API_KEY: configured"
          else
            echo "WARN: NVIDIA_API_KEY secret is empty. Assistant will answer from"
            echo "      retrieved facts only; /admin/content drafting is disabled."
          fi

      # -- FTPS transport (sequential ftplib mirror) -------------------------------
      # .github/scripts/ftp_mirror.py uploads over explicit FTPS, strictly one
      # file at a time, with per-file retries and reconnects.
      #
      # Why not lftp / FTP-Deploy-Action: both open parallel FTP data
      # connections, and this host's firewall RSTs them ("Connection refused").
      # A single sequential transfer works — verified live 2026-10-05.
      # (SSH was also tried and reverted: port 22 accepts TCP then resets the
      # handshake, so SSH can never authenticate from runner IPs.)
      #
      # No --delete: the old FTP deploys never deleted remote files either, and
      # deleting is how you lose /public_html/api (deployed separately below),
      # .well-known/ (Let's Encrypt), and runtime data under api/storage/ and
      # api/uploads/. Stale hashed assets (index-*.js) are a few hundred KB per
      # deploy and harmless — the HTML always points at the fresh hash.
      - name: Deploy frontend to public_html
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/ftp_mirror.py ./dist /public_html ".git*,.DS_Store"

      - name: Deploy API to public_html/api
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/ftp_mirror.py ./php-api /public_html/api ".git*,.DS_Store,tests/,scripts/"

      - name: Verify deployment
        run: |
          echo "--- API health ---"
          sleep 8
          curl -sk --max-time 40 https://shiarishta.com/api/health; echo
          echo "--- Frontend ---"
          curl -sk --max-time 40 -o /dev/null -w "frontend HTTP %{http_code}\n" https://shiarishta.com/
          # Prove the NEW build is actually served: the bundle hash in the live
          # HTML must match the hash vite just emitted into dist/index.html.
          # (A 200 here with a stale hash means the upload didn't take.)
          live_js=$(curl -sk --max-time 40 https://shiarishta.com/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          built_js=$(grep -o '/assets/index-[^"]*\.js' dist/index.html | head -1)
          echo "live bundle:  ${live_js:-<none found>}"
          echo "built bundle: ${built_js:-<none found>}"
          if [ -z "$live_js" ] || [ -z "$built_js" ]; then
            echo "FAIL: could not determine bundle hash from live site or dist"
            exit 1
          fi
          if [ "$live_js" != "$built_js" ]; then
            echo "FAIL: live site serves a stale bundle ($live_js != $built_js)"
            exit 1
          fi
          echo "OK: live site serves the fresh bundle"
          echo "--- .env must NOT be web-accessible ---"
          code=$(curl -sk --max-time 40 -o /dev/null -w "%{http_code}" https://shiarishta.com/api/.env)
          echo ".env HTTP $code"
          test "$code" = "403" -o "$code" = "404" && echo "OK: .env blocked" || echo "WARN: .env returned $code"

          # The audit that prompted this fix: internal PHP libraries were
          # directly reachable at /api/lib/db.php and the schema shipped at
          # /api/db/schema.sql. Fail the deploy if that regresses.
          echo "--- internal API sources must be blocked ---"
          for path in /api/lib/db.php /api/lib/jwt.php /api/routes/auth.php /api/db/schema.sql; do
            c=$(curl -sk --max-time 40 -o /dev/null -w "%{http_code}" "https://shiarishta.com${path}")
            echo "${path} -> HTTP ${c}"
            if [ "$c" != "403" ] && [ "$c" != "404" ]; then
              echo "FAIL: ${path} is reachable. Check the RedirectMatch rule in php-api/.htaccess."
              exit 1
            fi
          done
          echo "OK: internal sources blocked"
