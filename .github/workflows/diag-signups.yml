name: Diag Recent Signups (one-off, 2026-10-23)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      DIAG_TOKEN: ${{ secrets.DIAG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload diagnostic file
        run: |
          mkdir -p diag-upload
          cp php-api/diag-recent-signups.php diag-upload/
          python3 .github/scripts/ftp_mirror.py ./diag-upload /public_html/api ""
      - name: Query recent signups
        run: |
          sleep 5
          curl -s --max-time 30 "https://shiarishta.com/api/diag-recent-signups.php?t=$DIAG_TOKEN"
          echo ""
      - name: Delete remote diagnostic file
        if: always()
        run: |
          python3 - << 'EOF'
          import ftplib, os
          ftps = ftplib.FTP_TLS(os.environ["FTP_SERVER"], timeout=40)
          ftps.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftps.prot_p()
          try:
              ftps.delete("/public_html/api/diag-recent-signups.php")
              print("remote file deleted")
          except Exception as e:
              print("remote delete failed:", e)
          EOF
