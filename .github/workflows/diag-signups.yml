name: Diag Recent Signups (one-off, 2026-10-23)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      DIAG_TOKEN: ${{ secrets.DIAG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload diagnostic file
        run: |
          curl -s --insecure --ftp-ssl -T php-api/diag-recent-signups.php \
            "ftp://$FTP_USER:$FTP_PASS@$FTP_SERVER/public_html/api/diag-recent-signups.php" \
            && echo "uploaded"
      - name: Query recent signups
        run: |
          sleep 5
          curl -s --max-time 30 "https://shiarishta.com/api/diag-recent-signups.php?t=$DIAG_TOKEN"
          echo ""
      - name: Delete remote diagnostic file
        if: always()
        run: |
          curl -s --insecure --ftp-ssl -Q "DELE /public_html/api/diag-recent-signups.php" \
            "ftp://$FTP_USER:$FTP_PASS@$FTP_SERVER/" -o /dev/null \
            && echo "remote file deleted" || echo "remote delete attempted"
