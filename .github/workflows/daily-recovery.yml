name: Daily Signup Recovery

# Sends the recovery-email drip to incomplete signups:
# verify drip (unverified) + complete drip (verified but no bio/location).
# Capped at 4 verify + 3 complete emails per member; sends are tracked in
# recovery_emails so nobody is spammed and nobody is missed.

on:
  schedule:
    - cron: '30 13 * * *'  # 09:30 EDT daily
  workflow_dispatch:

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Run recovery drip
        env:
          BLOG_CRON_KEY: ${{ secrets.BLOG_CRON_KEY }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/recovery-out.txt -w "%{http_code}" --max-time 60 -H "X-Blog-Cron-Key: $BLOG_CRON_KEY" https://shiarishta.com/api/recovery-cron.php)
          echo "HTTP: $HTTP_CODE"
          echo "--- raw response (first 2000 chars) ---"
          head -c 2000 /tmp/recovery-out.txt
          echo ""
          echo "--- parsed ---"
          python3 -c "import json,sys; d=json.load(open('/tmp/recovery-out.txt')); assert d.get('ok'), d; print(f\"verify sent: {d['verify']['sent']}, complete sent: {d['complete']['sent']}\")"
